name: Backend checks
on:
  push:
    branches: [main]
    paths: ['server/**', 'scripts/check-*.mjs', 'wrangler.jsonc', '.github/workflows/backend-checks.yml']
  pull_request:
    paths: ['server/**', 'scripts/check-*.mjs', 'wrangler.jsonc', '.github/workflows/backend-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-backend.mjs
